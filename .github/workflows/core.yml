name: core

on:
  push:
    branches: [main]
    paths: ["core/**", "mac/scripts/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "mac/scripts/**", ".github/workflows/core.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # knode-format without sqlite-vec: spaces still open and search by words.
      - run: cargo clippy -p knode-format --no-default-features --all-targets -- -D warnings
      - run: cargo test -p knode-format --no-default-features
      # Without the semantic feature (as on aarch64 Linux until #108): search is by words.
      - run: cargo clippy -p knode-service -p knode-cli --no-default-features --all-targets -- -D warnings
      - run: cargo test -p knode-service --no-default-features --test search
      - run: cargo build -p knode-cli --no-default-features
      - name: Mac build input lists are up to date
        run: ../mac/scripts/update-inputs.sh --check
