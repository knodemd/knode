name: release

# Builds the knode binary for every platform when a version tag is pushed, and
# creates a draft GitHub Release with the archives and their checksums. The Linux builds
# do not need the Mac signing secrets: without them the draft has the Linux archives only.
# Publishing the draft runs homebrew.yml, which asks knodemd/homebrew-tap to update.
# The process is described in the handbook:
# https://github.com/knodemd/handbook/blob/main/07-releasing.md

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $tag is not vX.Y.Z or vX.Y.Z-pre"
            exit 1
          fi
          cargo_version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' core/Cargo.toml)"
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::Tag $tag does not match core/Cargo.toml version $cargo_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: Build macOS (Apple silicon, Intel, universal)
    needs: version
    runs-on: macos-26
    # The Linux jobs do not depend on this one. Without the Mac credentials this job fails
    # before it builds anything, so there is never an unsigned Mac download, and the draft
    # release gets the Linux archives only. Each secret is passed only to the steps that use it.
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Require release signing credentials
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY \
                      APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::The Mac release needs Developer ID signing and notarisation credentials. The Linux builds still run, but no draft release is created until this job passes."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
          rustc --version

      - name: Build
        working-directory: core
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p knode-cli --target "$target"
          done

      - name: Make the universal binary
        run: |
          mkdir -p dist/bin/universal-apple-darwin
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "dist/bin/$target"
            cp "core/target/$target/release/knode" "dist/bin/$target/knode"
          done
          lipo -create -output dist/bin/universal-apple-darwin/knode \
            dist/bin/aarch64-apple-darwin/knode dist/bin/x86_64-apple-darwin/knode
          lipo -info dist/bin/universal-apple-darwin/knode

      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          keychain_password="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      - name: Sign the command-line binaries
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            codesign --force --timestamp --options runtime \
              --sign "$MACOS_SIGNING_IDENTITY" "dist/bin/$target/knode"
            codesign --verify --strict --verbose=2 "dist/bin/$target/knode"
          done

      - name: Notarise the command-line binaries
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key"' EXIT
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          # A bare binary cannot be stapled; notarising it registers the ticket with
          # Apple, which Gatekeeper checks online.
          for target in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            ditto -c -k --keepParent "dist/bin/$target/knode" "$RUNNER_TEMP/knode-$target.zip"
            xcrun notarytool submit "$RUNNER_TEMP/knode-$target.zip" \
              --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
              --wait --timeout 30m
          done

      - name: Build the universal Mac app
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          # Notarisation needs the hardened runtime and a secure timestamp on every signature.
          # scripts/embed-knode-cli.sh signs the embedded knode command the same way.
          xcodebuild -project mac/Knode.xcodeproj -scheme Knode -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath mac/build/ReleaseData \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$MACOS_SIGNING_IDENTITY" \
            ENABLE_HARDENED_RUNTIME=YES OTHER_CODE_SIGN_FLAGS=--timestamp \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

      - name: Check the app signatures
        run: |
          app="mac/build/ReleaseData/Build/Products/Release/Knode.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for code in "$app" "$app/Contents/Helpers/knode"; do
            details="$(codesign -dv --verbose=4 "$code" 2>&1)"
            echo "$details" | grep -q '^Authority=Developer ID Application:' \
              || { echo "::error::$code is not signed with Developer ID Application"; exit 1; }
            echo "$details" | grep -q '^Timestamp=' \
              || { echo "::error::$code has no secure timestamp"; exit 1; }
            echo "$details" | grep -Eq '^CodeDirectory .*flags=.*runtime' \
              || { echo "::error::$code is not signed with the hardened runtime"; exit 1; }
          done

      - name: Notarise and staple the app
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          app="mac/build/ReleaseData/Build/Products/Release/Knode.app"
          key="$RUNNER_TEMP/AppAuthKey.p8"
          trap 'rm -f "$key"' EXIT
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Knode-notarise.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Knode-notarise.zip" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Package the disk image
        run: |
          mac/scripts/package-app.sh mac/build/ReleaseData/Build/Products/Release/Knode.app \
            "$VERSION" dist/release

      - name: Sign the disk image
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          image="dist/release/Knode-$VERSION.dmg"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$image"
          codesign --verify --strict --verbose=2 "$image"
          codesign -dv --verbose=4 "$image" 2>&1 | grep -q '^Timestamp=' \
            || { echo "::error::$image has no secure timestamp"; exit 1; }

      - name: Notarise and staple the disk image
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          image="dist/release/Knode-$VERSION.dmg"
          key="$RUNNER_TEMP/ImageAuthKey.p8"
          trap 'rm -f "$key"' EXIT
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          xcrun notarytool submit "$image" \
            --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$image"
          xcrun stapler validate "$image"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$image"
          # Signing and stapling change the image: checksum its final bytes.
          (cd dist/release && shasum -a 256 "Knode-$VERSION.dmg" > "Knode-$VERSION.dmg.sha256")

      - name: Package
        run: |
          mkdir -p dist/release
          for target in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            name="knode-v${VERSION}-${target}"
            stage="dist/stage/$name"
            mkdir -p "$stage"
            cp "dist/bin/$target/knode" LICENSE NOTICE README.md "$stage/"
            tar -C "$stage" -czf "dist/release/$name.tar.gz" knode LICENSE NOTICE README.md
            (cd dist/release && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          done
          ls -l dist/release

      - name: Remove the signing keychain and keys
        if: always()
        run: |
          temp="${RUNNER_TEMP:?}"
          if [ -e "$temp/release.keychain-db" ]; then
            security delete-keychain "$temp/release.keychain-db" || true
          fi
          for file in certificate.p12 AuthKey.p8 AppAuthKey.p8 ImageAuthKey.p8; do
            rm -f "$temp/$file"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Build Linux (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          # Built on the oldest supported runners so the binaries run on older glibc.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # Static binaries for musl systems such as Alpine and for glibc older than the
          # gnu builds need. Each is built on a runner of its own architecture, so the
          # musl-gcc from musl-tools compiles the C code (bundled SQLite, sqlite-vec).
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
          rustc --version

      - name: Install musl-tools
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          # sqlite-vec names the BSD integer types (u_int8_t and others), which glibc
          # declares but musl does not by default; map them to the standard ones.
          echo "TARGET_CFLAGS=-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t" >> "$GITHUB_ENV"

      - name: Build
        working-directory: core
        run: cargo build --release --locked -p knode-cli --target "$TARGET"

      - name: Check the binary
        run: |
          bin="core/target/$TARGET/release/knode"
          file "$bin"
          "$bin" --version | grep -F "$VERSION"
          if [[ "$TARGET" == *-musl ]]; then
            # The musl builds must not load anything at run time.
            file "$bin" | grep -E 'statically linked|static-pie linked'
          else
            # The newest glibc symbol the binary needs, which sets the oldest Linux it runs on.
            objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
          fi

      - name: Package
        run: |
          name="knode-v${VERSION}-${TARGET}"
          stage="dist/stage/$name"
          mkdir -p "$stage" dist/release
          cp "core/target/$TARGET/release/knode" LICENSE NOTICE README.md "$stage/"
          chmod 755 "$stage/knode"
          tar -C "$stage" --owner=0 --group=0 --numeric-owner \
            -czf "dist/release/$name.tar.gz" knode LICENSE NOTICE README.md
          (cd dist/release && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          ls -l dist/release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Create the draft release
    needs: [version, macos, linux]
    # Runs when every Linux build passed, whatever happened to the Mac job. A Mac job that
    # failed uploads nothing, so the draft then has the Linux archives only, and its title and
    # notes say it must not be published. Re-running the failed jobs once the Mac secrets are
    # set adds the Mac builds to the same draft.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      MACOS_RESULT: ${{ needs.macos.result }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Check the archives
        working-directory: dist
        run: |
          shopt -s nullglob
          missing=0
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            for file in "knode-v${VERSION}-${target}.tar.gz" "knode-v${VERSION}-${target}.tar.gz.sha256"; do
              [ -f "$file" ] || { echo "::error::$file is missing"; missing=1; }
            done
          done
          mac=(knode-v"${VERSION}"-*-apple-darwin.tar.gz* Knode-"${VERSION}".dmg*)
          if [ "$MACOS_RESULT" = success ]; then
            for target in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
              for file in "knode-v${VERSION}-${target}.tar.gz" "knode-v${VERSION}-${target}.tar.gz.sha256"; do
                [ -f "$file" ] || { echo "::error::$file is missing"; missing=1; }
              done
            done
            for file in "Knode-${VERSION}.dmg" "Knode-${VERSION}.dmg.sha256"; do
              [ -f "$file" ] || { echo "::error::$file is missing"; missing=1; }
            done
          else
            # Never ship part of a Mac job that did not pass.
            if [ "${#mac[@]}" -gt 0 ]; then
              rm -f -- "${mac[@]}"
            fi
            echo "::warning::The macOS job did not pass ($MACOS_RESULT): the draft has the Linux builds only. Set the Mac signing secrets and re-run the failed jobs to add the Mac builds."
          fi
          [ "$missing" = 0 ]
          ls -l

      - name: Checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(knode-*.tar.gz Knode-*.dmg)
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          # The section of CHANGELOG.md for this version, without its heading.
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              /^## / { if (found) exit; if (index($0, "[" v "]") || $2 == v) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > dist/CHANGES.md
          fi
          if [ -s dist/CHANGES.md ]; then
            echo "Using the CHANGELOG.md section for $VERSION"
          else
            echo "::warning::No CHANGELOG.md section for $VERSION, the draft starts from generated notes"
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" \
              --jq .body > dist/CHANGES.md
          fi
          {
            if [ "$MACOS_RESULT" != success ]; then
              echo "> [!WARNING]"
              echo "> This draft has the Linux builds only: the macOS job did not pass. Do not publish it."
              echo "> Set the Mac signing secrets and re-run the failed jobs of the release workflow; the"
              echo "> Mac builds are then added to this draft and this warning goes away."
              echo
            fi
            cat dist/CHANGES.md
          } > dist/NOTES.md
          rm dist/CHANGES.md

      - name: Create or update the draft release
        working-directory: dist
        run: |
          shopt -s nullglob
          title="Knode ${VERSION}"
          if [ "$MACOS_RESULT" != success ]; then
            title="$title (Linux only, do not publish)"
          fi
          assets=(knode-*.tar.gz knode-*.tar.gz.sha256 Knode-*.dmg Knode-*.dmg.sha256 SHA256SUMS)
          # Only "release not found" means there is none yet: any other error (the API, the
          # network, the token) stops here, so a second draft is never made for the same tag.
          view_err="$RUNNER_TEMP/release-view.err"
          if draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> "$view_err")"; then
            existing=true
          elif grep -qi 'release not found' "$view_err"; then
            existing=false
          else
            cat "$view_err" >&2
            echo "::error::Could not check whether release $GITHUB_REF_NAME exists; nothing was created or changed"
            exit 1
          fi
          if [ "$existing" = true ]; then
            # A re-run of this workflow: fill the draft it made before, never a published release.
            if [ "$draft" != true ]; then
              echo "::error::Release $GITHUB_REF_NAME is already published, it is not changed"
              exit 1
            fi
            if [ "$MACOS_RESULT" != success ]; then
              # Mac files from an earlier attempt are not covered by this SHA256SUMS.
              gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '.assets[].name | select(test("-apple-darwin\\.tar\\.gz|^Knode-.*\\.dmg"))' |
                while read -r name; do
                  gh release delete-asset "$GITHUB_REF_NAME" "$name" --repo "$GITHUB_REPOSITORY" --yes
                done
            fi
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file NOTES.md --prerelease="$PRERELEASE"
          else
            flags=(--draft --verify-tag --title "$title" --notes-file NOTES.md)
            if [ "$PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" "${assets[@]}"
          fi
