name: linux

# Builds and tests the core on the same Linux runners the release uses, so a change
# that breaks Linux (a macOS-only code path, a missing cfg, a C dependency) is caught
# in the pull request and not when a version is tagged.

on:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/linux.yml", ".github/workflows/release.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/linux.yml", ".github/workflows/release.yml"]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same runners as the release workflow, the oldest supported Ubuntu.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            # knode-embed's matrix maths (gemm) needs the FP16 extension to build on aarch64
            # Linux. knode-service and knode-cli leave it out on this target (their `semantic`
            # feature does nothing here, so search is by words), and it is left out here instead
            # of building everything for FP16, which older ARM boards lack (knodemd/knode#108).
            exclude: knode-embed
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      EXCLUDE: ${{ matrix.exclude }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
          rustc --version

      - name: Build the workspace
        run: cargo build --locked --workspace --all-targets ${EXCLUDE:+--exclude "$EXCLUDE"}

      - name: Test the workspace
        run: cargo test --locked --workspace ${EXCLUDE:+--exclude "$EXCLUDE"}

      - name: Build the release binary
        run: cargo build --release --locked -p knode-cli --target "$TARGET"

      - name: Run the release binary
        run: |
          bin="target/$TARGET/release/knode"
          file "$bin"
          "$bin" --version
          # The newest glibc symbol the binary needs, which sets the oldest Linux it runs on.
          objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1

  # Runs the co-editing concurrency test several times on aarch64 Linux, where a race between
  # programs writing the same note once showed (knodemd/knode#142).
  coediting-loop:
    name: Co-editing test loop (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-22.04-arm
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the test
        run: cargo test --locked -p knode-sync --test coediting --no-run

      - name: Run the test 5 times
        run: |
          failed=0
          for i in $(seq 1 5); do
            if cargo test --locked -p knode-sync --test coediting -q -- three_programs_writing_at_once_lose_nothing > out.txt 2>&1; then
              echo "run $i: ok"
            else
              echo "run $i: FAILED"; grep -E "panicked|Err" out.txt | head -4
              failed=$((failed + 1))
            fi
          done
          echo "$failed of 5 runs failed"
          test "$failed" -eq 0
