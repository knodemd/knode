name: linux

# Builds and tests the core on the same Linux runners the release uses, so a change
# that breaks Linux (a macOS-only code path, a missing cfg, a C dependency) is caught
# in the pull request and not when a version is tagged.

on:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/linux.yml", ".github/workflows/release.yml"]
  pull_request:
    paths: ["core/**", ".github/workflows/linux.yml", ".github/workflows/release.yml"]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same runners as the release workflow, the oldest supported Ubuntu.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
          rustc --version

      - name: Build the workspace
        run: cargo build --locked --workspace --all-targets

      - name: Test the workspace
        run: cargo test --locked --workspace

      # gemm (candle's matrix maths) has FP16 kernels that it picks at run time, and the rest of
      # the build must not need FP16, which older ARM boards such as the Raspberry Pi 4 lack
      # (knodemd/knode#108). Run the embedding tests, which run a tiny model, on an emulated
      # Cortex-A72 (the Raspberry Pi 4 CPU, no FP16): any FP16 instruction outside those
      # kernels would stop them with an illegal instruction.
      - name: Test search by meaning on a CPU without FP16
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -cpu cortex-a72
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user
          cargo test --locked -p knode-embed --lib

      - name: Build the release binary
        run: cargo build --release --locked -p knode-cli --target "$TARGET"

      - name: Run the release binary
        run: |
          bin="target/$TARGET/release/knode"
          file "$bin"
          "$bin" --version
          if [ "$TARGET" = aarch64-unknown-linux-gnu ]; then
            qemu-aarch64 -cpu cortex-a72 "$bin" --version
          fi
          # The newest glibc symbol the binary needs, which sets the oldest Linux it runs on.
          objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1

      # `knode service install` under the runner's real systemd, with a user manager like a
      # desktop login has: the unit is written, enabled and started, it comes back after a
      # crash, stays stopped when stopped on purpose, and `knode service uninstall` removes it.
      - name: Run Knode Service as a systemd user unit
        run: |
          bin="$PWD/target/$TARGET/release/knode"
          unit="$HOME/.config/systemd/user/knode.service"
          # Nothing is captured or indexed, so the check needs no agent and no download.
          mkdir -p "$HOME/.local/share/knode"
          printf 'capture = false\nembeddings = "off"\n' > "$HOME/.local/share/knode/config.toml"

          # A user manager for the runner, as a login session would start.
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          for _ in $(seq 100); do
            systemctl --user show-environment > /dev/null 2>&1 && break
            sleep 0.2
          done
          systemctl --user --version | head -n 1

          main_pid() { systemctl --user show --property MainPID --value knode.service; }
          # wait_for "what" command...: runs the command until it succeeds, for 20 seconds.
          wait_for() {
            what="$1"; shift
            for _ in $(seq 100); do
              "$@" > /dev/null 2>&1 && return 0
              sleep 0.2
            done
            echo "::error::Timed out waiting until $what"
            systemctl --user status knode.service --no-pager || true
            journalctl --user --unit knode.service --no-pager || true
            exit 1
          }

          "$bin" service install
          cat "$unit"
          grep -Fx "ExecStart=\"$bin\" service run" "$unit"
          test "$(systemctl --user is-enabled knode.service)" = enabled
          wait_for "the unit is active" systemctl --user is-active --quiet knode.service
          "$bin" service status | tee status.txt
          grep -q '^Knode Service .* is running' status.txt
          grep -Fq "Starts at login: yes, systemd user unit $unit" status.txt

          # A crash: systemd starts it again (Restart=on-failure).
          first="$(main_pid)"
          kill -KILL "$first"
          restarted() { pid="$(main_pid)"; [ "$pid" != 0 ] && [ "$pid" != "$first" ] && "$bin" service status | grep -q 'is running'; }
          wait_for "the service is back after a crash" restarted
          echo "Restarted after a crash: pid $first, then $(main_pid)"

          # Stopped on purpose: it exits cleanly and systemd leaves it stopped.
          "$bin" service stop
          wait_for "the unit is inactive" sh -c '! systemctl --user is-active --quiet knode.service'
          sleep 3
          if systemctl --user is-active --quiet knode.service; then
            echo "::error::systemd started Knode Service again after knode service stop"
            exit 1
          fi

          "$bin" service uninstall
          test ! -e "$unit"
          if systemctl --user is-enabled knode.service > /dev/null 2>&1; then
            echo "::error::knode.service is still enabled after knode service uninstall"
            exit 1
          fi
          "$bin" service status | grep -q 'Starts at login: no'

  # Builds the static musl binaries the release ships, and runs them on Alpine, a musl
  # system where the gnu builds do not run (knodemd/knode#84).
  musl:
    name: Build and run on Alpine (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same runners as the release workflow.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust and musl-tools
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
          rustc --version
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          # sqlite-vec names the BSD integer types (u_int8_t and others), which glibc
          # declares but musl does not by default; map them to the standard ones.
          echo "TARGET_CFLAGS=-Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int64_t=uint64_t" >> "$GITHUB_ENV"

      - name: Build the release binary
        run: cargo build --release --locked -p knode-cli --target "$TARGET"

      - name: Run the release binary on Alpine
        run: |
          bin="target/$TARGET/release/knode"
          file "$bin"
          file "$bin" | grep -E 'statically linked|static-pie linked'
          docker run --rm -v "$PWD/target/$TARGET/release:/knode:ro" alpine:3.22 \
            sh -c 'cat /etc/alpine-release && /knode/knode --version && /knode/knode --help > /dev/null'

  # Runs the co-editing concurrency test several times on aarch64 Linux, where a race between
  # programs writing the same note once showed (knodemd/knode#142).
  coediting-loop:
    name: Co-editing test loop (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-22.04-arm
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the test
        run: cargo test --locked -p knode-sync --test coediting --no-run

      - name: Run the test 5 times
        run: |
          failed=0
          for i in $(seq 1 5); do
            if cargo test --locked -p knode-sync --test coediting -q -- three_programs_writing_at_once_lose_nothing > out.txt 2>&1; then
              echo "run $i: ok"
            else
              echo "run $i: FAILED"; grep -E "panicked|Err" out.txt | head -4
              failed=$((failed + 1))
            fi
          done
          echo "$failed of 5 runs failed"
          test "$failed" -eq 0
