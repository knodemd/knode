name: Memory evaluation fixtures
on:
  pull_request:
    paths:
      - 'evaluation/memory/**'
      - '.github/workflows/memory-evaluation.yml'
  push:
    branches: [main]
    paths:
      - 'evaluation/memory/**'
      - '.github/workflows/memory-evaluation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline evaluator
        working-directory: evaluation/memory
        run: python3 -m unittest -v
