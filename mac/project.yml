# Generates Knode.xcodeproj with XcodeGen: run `xcodegen` in this folder after changing it.
name: Knode
options:
  bundleIdPrefix: md.knode
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing for local builds; release signing is set up by the release workflow.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # The Rust core, built by scripts/build-xcframework.sh. Xcode reads the library and the
    # KnodeCoreFFI module map straight from the XCFramework: it only accepts an XCFramework
    # dependency that exists before the build starts, and this one is made during the build.
    KNODE_CORE_SLICE: "$(SRCROOT)/build/KnodeCore/KnodeCore.xcframework/macos-arm64_x86_64"
    SWIFT_INCLUDE_PATHS: "$(inherited) $(KNODE_CORE_SLICE)/Headers"
packages:
  KnodeBrand:
    path: "../brand/12 Code/swift/KnodeBrand"
targets:
  Knode:
    type: application
    platform: macOS
    sources:
      - path: Knode
        excludes:
          - Info.plist
      - path: "../brand/07 App Icon/macOS/AppIcon.icns"
        buildPhase: resources
        group: Resources
    dependencies:
      - package: KnodeBrand
      - target: KnodeCore
    info:
      path: Knode/Info.plist
    settings:
      base:
        PRODUCT_NAME: Knode
        PRODUCT_BUNDLE_IDENTIFIER: md.knode.Knode
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        OTHER_LDFLAGS: "$(inherited) $(KNODE_CORE_SLICE)/libknode_ffi.a"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    postBuildScripts:
      - name: Document Icon
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(SRCROOT)/scripts/document-icon.sh"
          - "$(SRCROOT)/../brand/07 App Icon/Document/knode-document-icon-1024.png"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/KnodeDocument.icns"
        script: |
          "$SCRIPT_INPUT_FILE_0" "$SRCROOT/../brand/07 App Icon/Document" "$SCRIPT_OUTPUT_FILE_0"
  # The Swift bindings of the Rust core (core/crates/knode-ffi). Before it builds,
  # scripts/build-xcframework.sh builds the core and generates KnodeCore.swift; both live in the
  # ignored build/ folder and are never committed.
  KnodeCore:
    type: library.static
    platform: macOS
    sources:
      - path: build/KnodeCore/KnodeCore.swift
        optional: true
        group: KnodeCore
    settings:
      base:
        PRODUCT_NAME: KnodeCore
        # The script runs cargo, which reads and writes outside the declared files.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build Knode Core
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(SRCROOT)/scripts/build-xcframework.sh"
        inputFileLists:
          - "$(SRCROOT)/scripts/knode-core-inputs.xcfilelist"
        outputFiles:
          - "$(SRCROOT)/build/KnodeCore/KnodeCore.xcframework/macos-arm64_x86_64/libknode_ffi.a"
          - "$(SRCROOT)/build/KnodeCore/KnodeCore.xcframework/macos-arm64_x86_64/Headers/KnodeCoreFFI/KnodeCoreFFI.h"
          - "$(SRCROOT)/build/KnodeCore/KnodeCore.swift"
        script: |
          "$SRCROOT/scripts/build-xcframework.sh" "$SRCROOT/build/KnodeCore"
  KnodeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - KnodeTests
    dependencies:
      - target: Knode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: md.knode.KnodeTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Knode.app/Contents/MacOS/Knode"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Knode:
    build:
      targets:
        Knode: all
        KnodeTests: [test]
    test:
      targets:
        - KnodeTests
      gatherCoverageData: false
