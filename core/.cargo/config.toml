# gemm (the CPU matrix maths under candle, used by knode-embed) has half-precision kernels written
# in inline assembly that only assemble when the FP16 extension is enabled. It checks at run time
# whether the CPU has FP16 before using them, so enabling the extension at build time is safe.
# Apple targets already enable it.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+fp16"]
