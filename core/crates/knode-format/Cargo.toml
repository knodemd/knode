[package]
name = "knode-format"
description = "Read and write .knode spaces: nodes, links, provenance, history and search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
knode-md = { path = "../knode-md", version = "=0.0.0" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sqlite-vec = { version = "=0.1.9", optional = true }
thiserror = "=2.0.21"
ulid = "=3.0.0"

[dev-dependencies]
tempfile = "=3.27.0"

[features]
default = ["vector-search"]
# Search by meaning: compiles sqlite-vec in and loads it into every connection, so a space can
# hold embedding vectors (spec section 19). Without it, spaces still open and search by words.
vector-search = ["dep:sqlite-vec"]
