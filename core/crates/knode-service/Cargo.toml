[package]
name = "knode-service"
description = "Knode Service: the one process that opens spaces, for the app and the agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
knode-config = { path = "../knode-config", version = "=0.0.0" }
knode-format = { path = "../knode-format", version = "=0.0.0" }
knode-ingest = { path = "../knode-ingest", version = "=0.0.0" }
knode-vault = { path = "../knode-vault", version = "=0.0.0" }
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ulid = "=3.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[dev-dependencies]
tempfile = "=3.27.0"
