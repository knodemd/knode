[package]
name = "knode-service"
description = "Knode Service: the one process that opens spaces, for the app and the agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["semantic"]
# Search by meaning: Knode Service downloads a small embedding model once, indexes the open
# spaces in the background and answers `search` with words and meaning together. Without it,
# `search` is by words only.
semantic = ["dep:knode-embed"]

[dependencies]
base64 = "=0.23.1"
knode-config = { path = "../knode-config", version = "=0.0.0" }
knode-embed = { path = "../knode-embed", version = "=0.0.0", optional = true }
knode-format = { path = "../knode-format", version = "=0.0.0" }
knode-ingest = { path = "../knode-ingest", version = "=0.0.0" }
knode-sync = { path = "../knode-sync", version = "=0.0.0" }
knode-vault = { path = "../knode-vault", version = "=0.0.0" }
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
ulid = "=3.0.0"
unicode-normalization = "=0.1.26"

[target.'cfg(target_os = "macos")'.dependencies]
# Apple's Accelerate makes the model several times faster on the CPU of every Mac.
knode-embed = { path = "../knode-embed", version = "=0.0.0", optional = true, features = ["accelerate"] }
security-framework = "=3.7.0"

[dev-dependencies]
flate2 = "=1.1.10"
knode-embed = { path = "../knode-embed", version = "=0.0.0", features = ["test-support"] }
lopdf = { version = "=0.42.0", default-features = false }
md5 = "=0.7.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "=3.27.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
