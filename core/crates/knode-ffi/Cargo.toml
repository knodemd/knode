[package]
name = "knode-ffi"
description = "The bridge to Swift, Kotlin and the web, generated with UniFFI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[[bin]]
# Generates the Swift bindings: `cargo run -p knode-ffi --features bindgen --bin uniffi-bindgen`.
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
knode-config = { path = "../knode-config", version = "=0.0.0" }
knode-format = { path = "../knode-format", version = "=0.0.0" }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
uniffi = "=0.32.2"

[dev-dependencies]
tempfile = "=3.27.0"
