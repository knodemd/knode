[package]
name = "knode-mcp"
description = "The MCP server agents use to search, read and write a Knode space."
version.workspace = true
edition.workspace = true
# rmcp needs Rust 1.88.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
knode-format = { path = "../knode-format", version = "=0.0.0" }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.0", features = ["rt"] }

[dev-dependencies]
tempfile = "=3.27.0"
