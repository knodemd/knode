[package]
name = "knode-cli"
description = "The knode command line."
version.workspace = true
edition.workspace = true
# rmcp, through knode-mcp, needs Rust 1.88.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "knode"
path = "src/main.rs"

[features]
default = ["semantic"]
# Search by meaning, through Knode Service: a local model indexes the spaces in the background.
# On aarch64 Linux it is not built yet (knodemd/knode#108), so there `knode search` is by words.
semantic = ["knode-service/semantic"]

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
jsonc-parser = { version = "=0.34.0", features = ["cst", "serde_json"] }
knode-config = { path = "../knode-config", version = "=0.0.0" }
knode-format = { path = "../knode-format", version = "=0.0.0" }
knode-mcp = { path = "../knode-mcp", version = "=0.0.0" }
knode-service = { path = "../knode-service", version = "=0.0.0", default-features = false }
knode-vault = { path = "../knode-vault", version = "=0.0.0" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
toml_edit = "=0.25.17"

[dev-dependencies]
base64 = "=0.23.1"
flate2 = "=1.1.10"
lopdf = { version = "=0.42.0", default-features = false }
md5 = "=0.7.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(not(all(target_arch = "aarch64", target_os = "linux")))'.dev-dependencies]
knode-embed = { path = "../knode-embed", version = "=0.0.0", features = ["test-support"] }
