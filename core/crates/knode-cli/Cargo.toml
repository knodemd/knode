[package]
name = "knode-cli"
description = "The knode command line."
version.workspace = true
edition.workspace = true
# rmcp, through knode-mcp, needs Rust 1.88.
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "knode"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
knode-config = { path = "../knode-config", version = "=0.0.0" }
knode-format = { path = "../knode-format", version = "=0.0.0" }
knode-ingest = { path = "../knode-ingest", version = "=0.0.0" }
knode-mcp = { path = "../knode-mcp", version = "=0.0.0" }
knode-service = { path = "../knode-service", version = "=0.0.0" }
knode-vault = { path = "../knode-vault", version = "=0.0.0" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
toml_edit = "=0.25.17"

[dev-dependencies]
serde_json = "=1.0.154"
tempfile = "=3.27.0"
