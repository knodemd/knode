[package]
name = "knode-vault"
description = "Markdown in and out of .knode spaces: export, import (Obsidian vaults too) and a live Markdown folder, both ways."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
knode-format = { path = "../knode-format", version = "=0.0.0" }
knode-md = { path = "../knode-md", version = "=0.0.0" }
knode-sync = { path = "../knode-sync", version = "=0.0.0" }
notify = "=8.2.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"

[dev-dependencies]
tempfile = "=3.27.0"
