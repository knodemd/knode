[package]
name = "knode-vault"
description = "Markdown in and out of .knode spaces: export, import (Obsidian vaults too) and a live Markdown folder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["fetch"]
# Fetching web pages over HTTP for `reading::web::fetch`. Without it, saved `.html` files still
# import.
fetch = ["dep:ureq"]

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
csv = "=1.4.0"
dom_query = "=0.28.0"
dom_smoothie = "=0.18.2"
flate2 = "=1.1.10"
knode-format = { path = "../knode-format", version = "=0.0.0" }
knode-md = { path = "../knode-md", version = "=0.0.0" }
lopdf = { version = "=0.42.0", default-features = false }
md5 = "=0.7.0"
pdf-extract = "=0.12.1"
percent-encoding = "=2.3.2"
pulldown-cmark = { version = "=0.13.4", default-features = false }
quick-xml = "=0.42.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
thiserror = "=2.0.21"
ulid = "=3.0.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "=3.27.0"
