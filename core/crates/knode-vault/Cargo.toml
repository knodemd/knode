[package]
name = "knode-vault"
description = "Markdown in and out of .knode spaces: export, import (Obsidian vaults too) and a live Markdown folder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["fetch"]
# Fetching web pages over HTTP for `reading::web::fetch`. Without it, saved `.html` files still
# import.
fetch = ["dep:ureq"]

[dependencies]
knode-format = { path = "../knode-format", version = "=0.0.0" }
knode-md = { path = "../knode-md", version = "=0.0.0" }
pulldown-cmark = { version = "=0.13.4", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
csv = "=1.4.0"
dom_query = "=0.28.0"
dom_smoothie = "=0.18.2"
lopdf = { version = "=0.42.0", default-features = false }
pdf-extract = "=0.12.1"
sha2 = "=0.10.9"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
tempfile = "=3.27.0"
